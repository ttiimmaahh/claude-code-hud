name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leak-scan:
    name: Leak scan (repo-specific)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan tracked files for paths, emails and credentials
        run: ./scripts/check-leaks.sh

  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks needs full history to scan past commits

      # Run the pinned binary directly rather than gitleaks-action: the action
      # derives a <before>..<after> range from the push event, which breaks after
      # a history rewrite (the root commit has no parent) and silently scans ~0
      # bytes. Scanning all history unconditionally is what we actually want.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          # Download outside the checkout so the scan does not pick up its own tarball.
          tmp="$(mktemp -d)"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tmp/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $tmp/$tarball" | sha256sum -c -
          tar -xzf "$tmp/$tarball" -C "$tmp" gitleaks
          sudo install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          rm -rf "$tmp"
          gitleaks version

      - name: Scan full git history
        run: gitleaks git --no-banner --redact --verbose --exit-code 1 .

      - name: Scan working tree
        run: gitleaks dir --no-banner --redact --verbose --exit-code 1 .

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      # Fails the build if a renderer throws on a minimal payload.
      - name: Smoke-test the statusline
        run: |
          printf '%s' '{"hook_event_name":"Status","session_id":"ci","transcript_path":"/nonexistent.jsonl","cwd":"'"$PWD"'","model":{"id":"claude-opus-4-6","display_name":"Opus 4.6"},"workspace":{"current_dir":"'"$PWD"'","project_dir":"'"$PWD"'"}}' \
            | node dist/index.js
